<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting — Terranova Strategy</title>
  <script>
    (function () {
      var file = location.pathname.split("/").pop() || "";
      var slug = file.replace(/\.html$/i, "");
      if (!slug || slug.charAt(0) === "_") {
        location.replace("article.html");
        return;
      }
      location.replace("article.html?slug=" + encodeURIComponent(slug));
    })();
  </script>
  <meta http-equiv="refresh" content="0;url=article.html?slug=mont-blanc-summer-2026-territorial-economy">
</head>
<body>
  <p><a href="article.html?slug=mont-blanc-summer-2026-territorial-economy">Continue to Insights</a></p>
</body>
</html>
